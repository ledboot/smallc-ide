services:
  smallc-ide:
    image: docker.io/ledboot/smallc-ide:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      ADMIN_API_URL: "http://66.135.28.9:8080"
    restart: unless-stopped
